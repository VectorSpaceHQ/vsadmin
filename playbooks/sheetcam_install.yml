- hosts: computer-lab, office
  become: yes
  become_method: su
  vars:
    sc_user: vectorspace
    sc_home: "/home/{{ sc_user }}"
    sc_conf_dir: "{{ sc_home }}/.SheetCamTNG-dev"
    post_dir: "{{ sc_home }}/sheetcamtng/posts"
  tasks:


  - name: SheetCAM copy installer
    copy:
      src: /vsfs01/packages/SheetCam_setupV7.1.35-64.bin
      dest: /tmp/SheetCam_setupV7.1.35-64.bin
      owner: root
      mode: "0755"

  - name: Install SheetCAM
    ansible.builtin.shell:
      cmd: >-
        script -qec '/tmp/SheetCam_setupV7.1.35-64.bin
        --ui=stdio --noprompt --i-agree-to-all-licenses
        --destination /opt/sheetcam' /dev/null < /dev/null
      creates: /opt/sheetcam

  - name: SheetCAM ensure config directory exists
    file:
      path: "{{ sc_conf_dir }}"
      state: directory
      owner: "{{ sc_user }}"
      group: "{{ sc_user }}"
      mode: "0755"

  - name: SheetCAM license for vectorspace user
    copy:
      src: ../config_files/VectorSpace.camlic
      dest: "{{ sc_conf_dir }}/license.camlic"
      owner: "{{ sc_user }}"
      group: "{{ sc_user }}"
      mode: "0644"

  - name: SheetCAM configure
    copy:
      src: ../config_files/SheetCamTNG-dev.ini
      dest: "{{ sc_conf_dir }}/SheetCamTNG-dev.ini"
      owner: "{{ sc_user }}"
      group: "{{ sc_user }}"
      mode: "0644"

